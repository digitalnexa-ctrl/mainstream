<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wishlist | MAINSTREAM™</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f5ef;
    color:#111;
}

header{
    height:80px;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
}

.logo{
    height:42px;
    width:auto;
    filter: brightness(0) saturate(100%) invert(79%) sepia(91%) saturate(1200%) hue-rotate(5deg) brightness(105%) contrast(105%);
}

.nav{
    display:flex;
    align-items:center;
    gap:28px;
}

.nav a{
    color:white;
    text-decoration:none;
    font-size:13px;
    letter-spacing:1px;
}

.nav a.active{
    color:#f5d547;
}

.title{
    text-align:center;
    padding:55px 20px 35px;
}

.title h1{
    font-size:32px;
    letter-spacing:3px;
}

.title p{
    margin-top:10px;
    color:#777;
    font-size:13px;
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
    padding-bottom:70px;
}

.wishlist-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.wishlist-item{
    background:white;
    border:1px solid #ddd;
}

.product-image{
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
    background:#eee;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.product-info{
    padding:20px;
}

.product-info h3{
    font-size:17px;
    letter-spacing:1px;
    margin-bottom:8px;
}

.product-info p{
    color:#777;
    font-size:12px;
    margin-bottom:12px;
}

.price{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}

.buttons{
    display:flex;
    gap:10px;
}

.cart-btn,
.remove-btn{
    flex:1;
    padding:13px 8px;
    border:none;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
}

.cart-btn{
    background:#111;
    color:white;
}

.remove-btn{
    background:#f5d547;
    color:#111;
}

.empty{
    text-align:center;
    background:white;
    border:1px solid #ddd;
    padding:80px 20px;
}

.empty h2{
    font-size:22px;
    margin-bottom:10px;
}

.empty p{
    color:#777;
    margin-bottom:25px;
}

.shop-btn{
    display:inline-block;
    background:#111;
    color:white;
    text-decoration:none;
    padding:14px 25px;
    font-size:12px;
    letter-spacing:1px;
}

@media(max-width:600px){

    header{
        height:70px;
        padding:0 20px;
    }

    .logo{
    height:34px;
    }

    .nav{
        gap:15px;
    }

    .nav a{
        font-size:10px;
    }

    .title{
        padding:40px 15px 25px;
    }

    .title h1{
        font-size:25px;
    }

    .wishlist-grid{
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

    .product-info{
        padding:12px;
    }

    .product-info h3{
        font-size:13px;
    }

    .product-info p{
        font-size:10px;
    }

    .price{
        font-size:15px;
    }

    .buttons{
        flex-direction:column;
    }

    .cart-btn,
    .remove-btn{
        padding:11px 5px;
    }
}
</style>
</head>

<body>

<header>

<a href="index.html">
<img src="mainstream-logo.png" class="logo" alt="MAINSTREAM">
</a>

<nav class="nav">
<a href="index.html">HOME</a>
<a href="shop.html">SHOP</a>
<a href="wishlist.html" class="active">♡ WISHLIST</a>
<a href="cart.html">CART</a>
</nav>

</header>

<section class="title">

<h1>YOUR WISHLIST</h1>

<p>Save your favourite MAINSTREAM™ products</p>

</section>

<main class="container">

<div id="wishlistContainer"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const mainstreamDB = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const fallbackImages = {
    max:"max-front.png", lewis:"lewis-front.png", charles:"charles-front.png",
    lando:"lando-front.png", oscar:"oscar-front.png", george:"george-front.png",
    kimi:"kimi-front.png"
};

function getWishlist(){
    try { return JSON.parse(localStorage.getItem("mainstreamWishlist") || "[]"); }
    catch(error) { return []; }
}

function saveWishlist(wishlist){
    localStorage.setItem("mainstreamWishlist", JSON.stringify(wishlist));
}

async function getWishlistProducts(){
    const keys = getWishlist().map(key => String(key).trim().toLowerCase()).filter(Boolean);
    if(!keys.length) return [];

    // Load the current catalogue, then resolve both short legacy keys (e.g. "max")
    // and full Dashboard slugs (e.g. "max-03-tee") against the same product record.
    const {data, error} = await mainstreamDB
        .from("products")
        .select("slug,name,category,price,image_url,front_image,color_images");

    if(error){
        console.error("Wishlist products loading error:", error);
        return [];
    }

    const catalogue = data || [];
    return keys.map(key => {
        const keyCompact = key.replace(/[^a-z0-9]/g, "");
        const product = catalogue.find(item => {
            const slug = String(item.slug || "").toLowerCase();
            const name = String(item.name || "").toLowerCase();
            const slugCompact = slug.replace(/[^a-z0-9]/g, "");
            const nameCompact = name.replace(/[^a-z0-9]/g, "");
            return slug === key ||
                slugCompact === keyCompact ||
                slugCompact.startsWith(keyCompact) ||
                nameCompact.startsWith(keyCompact);
        });
        if(!product) return null;

        const variants = product.color_images || {};
        const black = variants.Black || variants.black || {};
        const image = black.front || product.front_image || product.image_url ||
            fallbackImages[key] || "mainstream-logo.png";

        return {
            key,
            name: product.name || key.toUpperCase(),
            category: product.category || "MAINSTREAM COLLECTION",
            price: Number(product.price || 0),
            image
        };
    }).filter(Boolean);
}

function addToCart(product){
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem("mainstreamCart") || "[]"); } catch(error) {}
    const existing = cart.find(item => item.name === product.name);
    if(existing){
        existing.quantity = Number(existing.quantity || 1) + 1;
    }else{
        cart.push({
            name: product.name,
            price: "₹" + product.price,
            image: product.image,
            size: "M",
            quantity: 1
        });
    }
    localStorage.setItem("mainstreamCart", JSON.stringify(cart));
    alert(product.name + " added to cart 🛒");
}

function removeFromWishlist(key){
    saveWishlist(getWishlist().filter(item => String(item).toLowerCase() !== key));
    renderWishlist();
}

async function renderWishlist(){
    const container = document.getElementById("wishlistContainer");
    const wishlist = getWishlist();

    if(!wishlist.length){
        container.innerHTML = `
            <div class="empty">
                <h2>Your wishlist is empty</h2>
                <p>Save your favourite products here.</p>
                <a href="shop.html" class="shop-btn">CONTINUE SHOPPING</a>
            </div>`;
        return;
    }

    container.innerHTML = "<p style='text-align:center;color:#777;padding:25px'>Loading wishlist...</p>";
    const products = await getWishlistProducts();

    if(!products.length){
        container.innerHTML = `
            <div class="empty">
                <h2>Wishlist products unavailable</h2>
                <p>Please open the shop and add the products again.</p>
                <a href="shop.html" class="shop-btn">CONTINUE SHOPPING</a>
            </div>`;
        return;
    }

    const grid = document.createElement("div");
    grid.className = "wishlist-grid";

    products.forEach(product => {
        const item = document.createElement("div");
        item.className = "wishlist-item";
        const image = document.createElement("img");
        image.src = product.image;
        image.alt = product.name;
        image.onerror = function(){ this.onerror=null; this.src="mainstream-logo.png"; };
        const imageWrap = document.createElement("div");
        imageWrap.className = "product-image";
        imageWrap.appendChild(image);

        const info = document.createElement("div");
        info.className = "product-info";
        const name = document.createElement("h3");
        name.textContent = product.name;
        const category = document.createElement("p");
        category.textContent = product.category;
        const price = document.createElement("div");
        price.className = "price";
        price.textContent = "₹" + product.price.toLocaleString("en-IN");
        const buttons = document.createElement("div");
        buttons.className = "buttons";
        const cart = document.createElement("button");
        cart.className = "cart-btn";
        cart.textContent = "ADD TO CART";
        cart.addEventListener("click", () => addToCart(product));
        const remove = document.createElement("button");
        remove.className = "remove-btn";
        remove.textContent = "REMOVE";
        remove.addEventListener("click", () => removeFromWishlist(product.key));
        buttons.append(cart, remove);
        info.append(name, category, price, buttons);
        item.append(imageWrap, info);
        grid.appendChild(item);
    });

    container.innerHTML = "";
    container.appendChild(grid);
}

renderWishlist();
</script>

</body>
</html>
