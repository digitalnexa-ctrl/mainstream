<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store Settings | MAINSTREAM</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}header{height:76px;background:#090909;border-bottom:1px solid #292929;display:flex;align-items:center;justify-content:space-between;padding:0 5%}header img{width:165px;filter:brightness(0) saturate(100%) invert(82%) sepia(99%) saturate(1700%) hue-rotate(4deg) brightness(105%) contrast(105%)}nav{display:flex;gap:22px}a{color:#ffd400;text-decoration:none;font-size:11px;font-weight:bold}main{max-width:1400px;margin:auto;padding:38px 5% 80px}.eyebrow{color:#ffd400;font-size:10px;letter-spacing:3px;font-weight:bold}h1{font-size:38px;margin:10px 0}.heading{margin-bottom:28px}.heading p:last-child,.muted{color:#888;font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.card,.panel{background:#151515;border:1px solid #292929;border-radius:12px;padding:20px}.label{color:#888;font-size:10px;letter-spacing:1.5px}.value{font-size:28px;font-weight:900;margin-top:12px}.table-wrap{overflow:auto;background:#151515;border:1px solid #292929;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:15px 18px;border-bottom:1px solid #292929;font-size:12px}th{color:#888;font-size:9px;letter-spacing:1.2px}td{color:#ddd}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select{background:#101010;color:#fff;border:1px solid #333;border-radius:7px;padding:12px;font:inherit}button{background:#ffd400;color:#111;border:0;border-radius:7px;padding:12px 18px;font-weight:800;cursor:pointer}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:8px}.field label{color:#aaa;font-size:11px}.field input{width:100%}.actions{margin-top:20px;display:flex;gap:12px;align-items:center}.status{color:#39d98a;font-size:12px}@media(max-width:700px){main{padding:25px 16px 60px}.cards{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}h1{font-size:30px}}</style></head><body><header><a href="admin.html"><img src="mainstream-logo.png" alt="MAINSTREAM"></a><nav><a href="admin.html">DASHBOARD</a><a href="orders.html">ORDERS</a></nav></header><main><div class="heading"><p class="eyebrow">MAINSTREAM ADMIN</p><h1>Store Settings</h1><p>Update store contact details and shipping defaults.</p></div><section class="panel"><form id="f"><div class="form-grid"><div class="field"><label>STORE NAME</label><input name="store_name" required></div><div class="field"><label>CONTACT EMAIL</label><input name="contact_email" type="email"></div><div class="field"><label>CONTACT PHONE</label><input name="contact_phone"></div><div class="field"><label>SHIPPING CHARGE (₹)</label><input name="shipping_charge" type="number" min="0" step=".01"></div><div class="field"><label>FREE SHIPPING ABOVE (₹)</label><input name="free_shipping_threshold" type="number" min="0" step=".01"></div></div><div class="actions"><button type="submit">SAVE SETTINGS</button><span id="status" class="status"></span></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const money=v=>"₹"+Number(v||0).toLocaleString("en-IN");const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function guard(){const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html";return false;}return true;}const f=document.getElementById("f");async function load(){if(!await guard())return;const {data,error}=await db.from("store_settings").select("*").eq("id",1).maybeSingle();if(error){document.getElementById("status").textContent="Run the SQL setup first.";return}if(data)Object.keys(data).forEach(k=>{if(f.elements[k])f.elements[k].value=data[k]??""})}f.addEventListener("submit",async e=>{e.preventDefault();if(!await guard())return;const v=Object.fromEntries(new FormData(f).entries());v.shipping_charge=Number(v.shipping_charge||0);v.free_shipping_threshold=v.free_shipping_threshold===""?null:Number(v.free_shipping_threshold);v.updated_at=new Date().toISOString();const {error}=await db.from("store_settings").update(v).eq("id",1);document.getElementById("status").textContent=error?error.message:"Settings saved successfully."});load();</script></body></html>
