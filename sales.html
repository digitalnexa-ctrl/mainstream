<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Analytics | MAINSTREAM</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}header{height:76px;background:#090909;border-bottom:1px solid #292929;display:flex;align-items:center;justify-content:space-between;padding:0 5%}header img{width:165px;filter:brightness(0) saturate(100%) invert(82%) sepia(99%) saturate(1700%) hue-rotate(4deg) brightness(105%) contrast(105%)}nav{display:flex;gap:22px}a{color:#ffd400;text-decoration:none;font-size:11px;font-weight:bold}main{max-width:1400px;margin:auto;padding:38px 5% 80px}.eyebrow{color:#ffd400;font-size:10px;letter-spacing:3px;font-weight:bold}h1{font-size:38px;margin:10px 0}.heading{margin-bottom:28px}.heading p:last-child,.muted{color:#888;font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.card,.panel{background:#151515;border:1px solid #292929;border-radius:12px;padding:20px}.label{color:#888;font-size:10px;letter-spacing:1.5px}.value{font-size:28px;font-weight:900;margin-top:12px}.table-wrap{overflow:auto;background:#151515;border:1px solid #292929;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:15px 18px;border-bottom:1px solid #292929;font-size:12px}th{color:#888;font-size:9px;letter-spacing:1.2px}td{color:#ddd}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select{background:#101010;color:#fff;border:1px solid #333;border-radius:7px;padding:12px;font:inherit}button{background:#ffd400;color:#111;border:0;border-radius:7px;padding:12px 18px;font-weight:800;cursor:pointer}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:8px}.field label{color:#aaa;font-size:11px}.field input{width:100%}.actions{margin-top:20px;display:flex;gap:12px;align-items:center}.status{color:#39d98a;font-size:12px}@media(max-width:700px){main{padding:25px 16px 60px}.cards{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}h1{font-size:30px}}</style></head><body><header><a href="admin.html"><img src="mainstream-logo.png" alt="MAINSTREAM"></a><nav><a href="admin.html">DASHBOARD</a><a href="orders.html">ORDERS</a></nav></header><main><div class="heading"><p class="eyebrow">MAINSTREAM ADMIN</p><h1>Sales Analytics</h1><p>Revenue is calculated from PAID and CAPTURED orders only.</p></div><section class="cards"><div class="card"><div class="label">PAID REVENUE</div><div class="value" id="rev">₹0</div></div><div class="card"><div class="label">PAID ORDERS</div><div class="value" id="cnt">0</div></div><div class="card"><div class="label">AVERAGE ORDER</div><div class="value" id="avg">₹0</div></div></section><div class="toolbar"><select id="period"><option value="month">THIS MONTH</option><option value="week">LAST 7 DAYS</option><option value="year">THIS YEAR</option><option value="all">ALL TIME</option></select></div><div class="panel"><p class="muted" id="note">Loading paid orders…</p><div id="table"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const money=v=>"₹"+Number(v||0).toLocaleString("en-IN");const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function guard(){const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html";return false;}return true;}let paid=[];async function load(){if(!await guard())return;const {data,error}=await db.from("orders").select("total,payment_status,created_at").order("created_at",{ascending:false}).limit(3000);if(error){document.getElementById("note").textContent=error.message;return}paid=(data||[]).filter(o=>["paid","captured"].includes(String(o.payment_status||"").toLowerCase()));render()}function render(){const p=document.getElementById("period").value,n=new Date();let start=new Date(0);if(p==="month")start=new Date(n.getFullYear(),n.getMonth(),1);if(p==="week")start=new Date(n.getTime()-7*86400000);if(p==="year")start=new Date(n.getFullYear(),0,1);const a=paid.filter(o=>p==="all"||new Date(o.created_at)>=start),sum=a.reduce((s,o)=>s+Number(o.total||0),0);document.getElementById("rev").textContent=money(sum);document.getElementById("cnt").textContent=a.length;document.getElementById("avg").textContent=money(a.length?sum/a.length:0);document.getElementById("note").textContent=a.length+" paid orders in this period.";const g={};a.forEach(o=>{const d=new Date(o.created_at).toLocaleDateString("en-IN");g[d]=(g[d]||0)+Number(o.total||0)});const es=Object.entries(g);document.getElementById("table").innerHTML=es.length?'<div class="table-wrap"><table><thead><tr><th>DATE</th><th>PAID REVENUE</th></tr></thead><tbody>'+es.map(([d,v])=>'<tr><td>'+esc(d)+'</td><td>'+money(v)+'</td></tr>').join("")+'</tbody></table></div>':'<p class="muted">No paid orders in this period.</p>'}document.getElementById("period").addEventListener("change",render);load();</script></body></html>
