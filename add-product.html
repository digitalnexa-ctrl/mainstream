<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product | MAINSTREAM™</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0d0d0d;
    color:#fff;
}

.header{
    height:76px;
    background:#090909;
    border-bottom:1px solid #292929;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
}

.logo{
    width:165px;
    filter:
    brightness(0)
    saturate(100%)
    invert(82%)
    sepia(99%)
    saturate(1700%)
    hue-rotate(4deg)
    brightness(105%)
    contrast(105%);
}

.back{
    color:#FFD400;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
}

.main{
    max-width:900px;
    margin:auto;
    padding:30px;
}

.title{
    font-size:30px;
    font-weight:900;
    margin-bottom:7px;
}

.subtitle{
    color:#777;
    font-size:13px;
    margin-bottom:28px;
}

.form-card{
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    padding:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.field.full{
    grid-column:1/-1;
}

label{
    color:#aaa;
    font-size:10px;
    font-weight:bold;
    letter-spacing:1px;
}

input,
select,
textarea{
    width:100%;
    background:#0d0d0d;
    border:1px solid #333;
    color:#fff;
    border-radius:8px;
    padding:13px;
    outline:none;
    font-family:inherit;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#FFD400;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.image-box{
    border:1px dashed #444;
    border-radius:10px;
    padding:25px;
    text-align:center;
    color:#777;
}

.image-box input{
    border:0;
    background:transparent;
    padding:10px 0;
}

.actions{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:25px;
}

.cancel{
    background:#222;
    color:#aaa;
    border:1px solid #333;
    padding:13px 20px;
    border-radius:8px;
    text-decoration:none;
    font-size:11px;
    font-weight:bold;
}

.save{
    background:#FFD400;
    color:#111;
    border:0;
    padding:13px 22px;
    border-radius:8px;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
}

.save:hover{
    background:#e8bc00;
}

@media(max-width:650px){

    .header{
        padding:0 16px;
    }

    .logo{
        width:125px;
    }

    .main{
        padding:20px 15px;
    }

    .title{
        font-size:25px;
    }

    .form-card{
        padding:18px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .actions{
        flex-direction:column;
    }

    .cancel,
    .save{
        width:100%;
        text-align:center;
    }

}

</style>
</head>

<body>

<header class="header">

    <img
        src="mainstream-logo.png"
        class="logo"
        alt="MAINSTREAM™">

    <a href="inventory.html" class="back">
        ← INVENTORY
    </a>

</header>


<main class="main">

    <h1 class="title">
        Add Product
    </h1>

    <p class="subtitle">
        Add a new product to your MAINSTREAM™ collection.
    </p>


<form class="form-card" onsubmit="saveProduct(event)">

        <div class="form-grid">


            <div class="field">

                <label>
                    PRODUCT NAME
                </label>

                <input
    id="productName"
    type="text"
    placeholder="Example: MAX / 03 TEE"
    required>
            </div>


            <div class="field">

                <label>
                    PRICE
                </label>

                <input
    id="productPrice"
    type="number"
    placeholder="999"
    required>

            </div>


            <div class="field">

                <label>
                    CATEGORY
                </label>

                <select>

                    <option>
                        Racing Collection
                    </option>

                    <option>
                        Streetwear
                    </option>

                    <option>
                        New Collection
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    STOCK QUANTITY
                </label>

                <input
    id="productStock"
    type="number"
    placeholder="100"
    min="0"
    required>

            </div>


            <div class="field full">

                <label>
                    PRODUCT DESCRIPTION
                </label>

                <textarea
                    placeholder="Enter product description..."></textarea>

            </div>


            <div class="field full">

                <label>
                    PRODUCT IMAGE
                </label>

                <div class="image-box">

                    <div>
                        Upload product image
                    </div>

                    <input
                        type="file"
                        accept="image/*">

                </div>

            </div>


        </div>


        <div class="actions">

            <a
                href="inventory.html"
                class="cancel">
                CANCEL
            </a>

            <button
                type="submit"
                class="save">
                SAVE PRODUCT
            </button>

        </div>

    </form>

</main>
<script>

function saveProduct(event){

    event.preventDefault();

    const name =
        document.getElementById("productName").value.trim();

    const price =
        document.getElementById("productPrice").value;

    const stock =
        document.getElementById("productStock").value;

    const product = {
        id: Date.now(),
        name: name,
        price: Number(price),
        stock: Number(stock)
    };

    const products =
        JSON.parse(
            localStorage.getItem("mainstreamProducts")
        ) || [];

    products.push(product);

    localStorage.setItem(
        "mainstreamProducts",
        JSON.stringify(products)
    );

    alert("Product added successfully!");

    window.location.href = "inventory.html";
}

</script>
</body>
</html>
