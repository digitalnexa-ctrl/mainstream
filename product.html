<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAINSTREAM™ Product</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f2;
    color:#111;
}

header{
    height:90px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    width:220px;
    max-width:55%;
}

.cart-btn{
    background:#ffd400;
    border:0;
    padding:22px 30px;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
}

.page{
    max-width:1250px;
    margin:auto;
    padding:50px 35px 80px;
}

.breadcrumb{
    font-size:22px;
    color:#777;
    margin-bottom:40px;
}

.product-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:55px;
}

.gallery{
    display:flex;
    gap:20px;
}

.thumbnails{
    width:120px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.thumb{
    width:120px;
    height:145px;
    background:#eee;
    border:2px solid transparent;
    overflow:hidden;
    cursor:pointer;
}

.thumb.active{
    border:4px solid #111;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.thumb.front img{
    object-position:left center;
}

.thumb.back img{
    object-position:right center;
}

.thumb.combined img,
.thumb.sizechart img{
    object-fit:contain;
}

.main-image-box{
    flex:1;
    min-width:0;
    height:650px;
    background:#eee;
    overflow:hidden;
    position:relative;
}

.main-photo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.main-photo.front{
    object-position:left center;
}

.main-photo.back{
    object-position:right center;
}

.main-photo.combined,
.main-photo.sizechart{
    object-fit:contain;
}

.drag-label{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    color:#fff;
    padding:16px 30px;
    border-radius:40px;
    font-size:16px;
    white-space:nowrap;
}

.product-info{
    padding-top:10px;
}

.product-name{
    font-size:52px;
    font-weight:900;
    line-height:1;
    margin-bottom:35px;
}

.product-price{
    font-size:34px;
    font-weight:800;
    margin-bottom:45px;
}

.option-group{
    margin-bottom:35px;
}

.option-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:15px;
}

.size-options{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.size-option{
    min-width:60px;
    padding:14px 18px;
    border:2px solid #111;
    background:#fff;
    font-weight:700;
    cursor:pointer;
}

.size-option.active{
    background:#111;
    color:#fff;
}

.quantity-box{
    display:flex;
    align-items:center;
    margin-bottom:30px;
}

.quantity-box button{
    width:48px;
    height:48px;
    border:2px solid #111;
    background:#fff;
    font-size:24px;
    cursor:pointer;
}

.quantity-number{
    width:60px;
    text-align:center;
    font-size:20px;
    font-weight:700;
}

.action-buttons{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.add-cart,
.buy-now{
    width:100%;
    padding:20px;
    border:0;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}

.add-cart{
    background:#111;
    color:#fff;
}

.buy-now{
    background:#ffd400;
    color:#111;
}

.details{
    margin-top:50px;
    border-top:1px solid #ccc;
    padding-top:30px;
}

.details h3{
    font-size:24px;
    margin-bottom:15px;
}

.details p{
    color:#555;
    line-height:1.7;
}

.loading{
    padding:40px;
    text-align:center;
    font-weight:700;
}

@media (max-width: 900px){

    .product-layout{
        display:block !important;
    }

    .gallery{
        width:100%;
        display:flex;
        gap:12px;
        margin-bottom:60px;
    }

    .thumbnails{
        width:82px;
        min-width:82px;
        gap:12px;
    }

    .thumb{
        width:82px;
        height:105px;
    }

    .main-image-box{
        flex:1;
        width:100%;
        height:650px;
    }

    .product-info{
        width:100%;
        margin-top:0;
        padding-top:0;
    }

    .product-name{
        font-size:42px;
        line-height:1.05;
        margin-bottom:45px;
    }

    .product-price{
        font-size:32px;
        margin-bottom:45px;
    }
}

@media(max-width:500px){

    .main-image-box{
        height:420px;
    }

    .drag-label{
        font-size:13px;
        padding:12px 18px;
    }

    .product-name{
        font-size:34px;
    }
}
/* =====================================================
   MAINSTREAM™ — PREMIUM PRODUCT PAGE
   ===================================================== */

.product-layout{
    max-width:1400px;
    margin:0 auto;
    padding:70px 5%;
    gap:70px;
}

.gallery{
    position:relative;
}

.thumbnails{
    gap:10px;
}

.thumb{
    border:1px solid #ddd;
    transition:.3s ease;
}

.thumb:hover{
    border-color:#111;
    transform:translateY(-3px);
}

.main-image-box{
    position:relative;
    background:#f2f2ee;
    overflow:hidden;
}

.main-image-box::before{
    content:"MAINSTREAM™";
    position:absolute;
    top:20px;
    left:22px;
    z-index:5;
    font-size:9px;
    font-weight:900;
    letter-spacing:4px;
    color:#fff;
    mix-blend-mode:difference;
    pointer-events:none;
}

.main-image-box::after{
    content:"RACING / STREET / 2026";
    position:absolute;
    bottom:20px;
    right:22px;
    z-index:5;
    font-size:8px;
    font-weight:900;
    letter-spacing:3px;
    color:#fff;
    mix-blend-mode:difference;
    pointer-events:none;
}

.main-image{
    transition:transform .8s cubic-bezier(.2,.8,.2,1);
}

.main-image-box:hover .main-image{
    transform:scale(1.025);
}

.product-info{
    padding-top:15px;
}

.product-name{
    font-size:clamp(42px,5vw,76px);
    line-height:.9;
    letter-spacing:-4px;
    text-transform:uppercase;
    margin-bottom:25px;
}

.product-price{
    font-size:25px;
    font-weight:700;
    margin-bottom:35px;
}

.product-description{
    max-width:500px;
    color:#666;
    line-height:1.8;
}

.size-selector{
    margin-top:35px;
}

.size-selector button{
    border:1px solid #ccc;
    background:#fff;
    transition:.3s ease;
}

.size-selector button:hover,
.size-selector button.active{
    background:#111;
    color:#fff;
    border-color:#111;
}

.quantity{
    border:1px solid #111;
}

.add-cart-btn,
.buy-now-btn{
    min-height:55px;
    transition:.35s ease;
}

.add-cart-btn:hover{
    background:#111;
    color:#fff;
    box-shadow:6px 6px 0 #ffd900;
}

.buy-now-btn:hover{
    transform:translateY(-3px);
    box-shadow:6px 6px 0 #ffd900;
}

@media(max-width:800px){

    .product-layout{
        padding:35px 18px 70px;
        gap:35px;
    }

    .product-name{
        font-size:46px;
        letter-spacing:-3px;
    }

    .product-price{
        font-size:24px;
    }
}
</style>
</head>

<body>

<header>

<a href="index.html">
<img
src="mainstream-logo.png"
class="logo"
alt="MAINSTREAM">
</a>

<button
class="cart-btn"
onclick="location.href='cart.html'">

CART <span id="cartCount">0</span>

</button>

</header>


<main class="page">

<div class="breadcrumb">
Home → Shop → Product
</div>


<div
id="loading"
class="loading">

Loading product...

</div>


<div
class="product-layout"
id="productLayout"
style="display:none">


<section class="gallery">


<div class="thumbnails">


<div
class="thumb front active"
onclick="showImage('front',this)">

<img
id="frontThumb"
src="mainstream-logo.png"
alt="Front">

</div>


<div
class="thumb back"
onclick="showImage('back',this)">

<img
id="backThumb"
src="mainstream-logo.png"
alt="Back">

</div>


<div
class="thumb sizechart"
onclick="showImage('sizechart',this)">

<img
src="size-chart.png"
alt="Oversized T-shirt size chart">

</div>


</div>


<div
class="main-image-box"
id="imageBox">

<img
id="mainProductImage"
class="main-photo front"
src="mainstream-logo.png"
alt="Product front view">



</div>


</section>


<section class="product-info">


<h1
class="product-name"
id="productName">

PRODUCT

</h1>


<div
class="product-price"
id="productPrice">

₹899

</div>


<div class="option-group">

<div class="option-title">
SIZE
</div>


<div class="size-options">

<button
class="size-option"
onclick="selectSize('S',this)">
S
</button>

<button
class="size-option active"
onclick="selectSize('M',this)">
M
</button>

<button
class="size-option"
onclick="selectSize('L',this)">
L
</button>

<button
class="size-option"
onclick="selectSize('XL',this)">
XL
</button>

<button
class="size-option"
onclick="selectSize('XXL',this)">
XXL
</button>

</div>

</div>


<div class="option-title">
QUANTITY
</div>


<div class="quantity-box">

<button onclick="changeQuantity(-1)">
−
</button>

<div
class="quantity-number"
id="quantity">
1
</div>

<button onclick="changeQuantity(1)">
+
</button>

</div>


<div class="action-buttons">

<button
class="add-cart"
onclick="addToCart()">

ADD TO CART

</button>


<button
class="buy-now"
onclick="buyNow()">

BUY NOW

</button>

</div>


<div class="details">

<h3>
PRODUCT DETAILS
</h3>

<p id="productDescription">

100% Premium French Terry Cotton · 250 GSM · Relaxed Unisex Oversized Fit · Sizes S–XXL.

</p>

</div>


</section>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

let mainstreamDB = null;

// Keep the product page working even if Supabase/CDN is unavailable.
try {
    if (
        window.supabase &&
        typeof SUPABASE_URL !== "undefined" &&
        typeof SUPABASE_PUBLISHABLE_KEY !== "undefined"
    ) {
        mainstreamDB = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );
    }
} catch (error) {
    console.warn("Supabase unavailable; using built-in product data.", error);
}


/* ================= PRODUCT ================= */

const params =
new URLSearchParams(
    window.location.search
);

const requestedProduct =
    params.get("product") ||
    params.get("slug") ||
    "max";

const productKeyAliases = {
    "max-03-tee": "max",
    "lewis-44-tee": "lewis",
    "charles-16-tee": "charles",
    "lando-01-tee": "lando",
    "oscar-81-tee": "oscar",
    "george-63-tee": "george",
    "kimi-12-tee": "kimi"
};

const productKey =
    productKeyAliases[requestedProduct] ||
    requestedProduct;


/* ================= FALLBACK PRODUCTS ================= */

const fallbackProducts = {

    max:{
        name:"MAX / 03 TEE",
        price:899,
        front:"max-front.png",
        back:"max-back.png",
        combined:"max.jpg"
    },

    lewis:{
        name:"LEWIS / 44 TEE",
        price:899,
        front:"lewis-front.png",
        back:"lewis-back.png",
        combined:"lewis.jpg"
    },

    charles:{
        name:"CHARLES / 16 TEE",
        price:899,
        front:"charles-front.png",
        back:"charles-back.png",
        combined:"charles.jpg"
    },

    lando:{
        name:"LANDO / 01 TEE",
        price:899,
        front:"lando-front.png",
        back:"lando-back.png",
        combined:"lando.jpg"
    },

    oscar:{
        name:"OSCAR / 81 TEE",
        price:899,
        front:"oscar-front.png",
        back:"oscar-back.png",
        combined:"oscar.jpg"
    },

    george:{
        name:"GEORGE / 63 TEE",
        price:899,
        front:"george-front.png",
        back:"george-back.png",
        combined:"george.jpg"
    },

    kimi:{
        name:"KIMI / 12 TEE",
        price:899,
        front:"kimi-front.png",
        back:"kimi-back.png",
        combined:"kimi.jpg"
    }

};


let currentProduct = null;

let selectedSize = "M";

let quantity = 1;

let currentView = "front";


/* ================= IMAGE HELPERS ================= */

function usable(value){

    return (
        typeof value === "string" &&
        value.trim() !== ""
    );

}


function pick(value,fallback){

    return usable(value)
        ? value
        : fallback;

}


/* ================= LOAD PRODUCT ================= */

async function loadProduct(){

    const fallback =
        fallbackProducts[productKey]
        || fallbackProducts.max;

    // Render the correct local product immediately; Supabase is optional.
    currentProduct = fallback;
    renderProduct();

    if (!mainstreamDB) {
        return;
    }

    try{

        const {data,error} =
            await mainstreamDB
            .from("products")
            .select("*")
            .eq("slug",requestedProduct)
            .eq("active",true)
            .single();


        if(error || !data){

            console.warn(
                "Supabase product not found:",
                error
            );

            currentProduct = fallback;

        }

        else{

            currentProduct = {

                id:data.id,

                name:
                    data.name
                    || fallback.name,

                price:
                    Number(data.price) > 0
                        ? Number(data.price)
                        : Number(fallback.price || 999),

                front: fallback.front,

                back: fallback.back,

                combined: fallback.combined,

                description:
                    data.description || ""

            };

        }


        renderProduct();


    }

    catch(error){

        console.error(
            "Product loading error:",
            error
        );

        currentProduct = fallback;

        renderProduct();

    }

}


/* ================= RENDER ================= */

function renderProduct(){

    document.getElementById(
        "productName"
    ).textContent =
        currentProduct.name;


    document.getElementById(
        "productPrice"
    ).textContent =
        "₹" +
        Number(
            currentProduct.price || 0
        ).toLocaleString("en-IN");


    document.getElementById(
        "frontThumb"
    ).src =
        currentProduct.front;


    document.getElementById(
        "backThumb"
    ).src =
        currentProduct.back;


    document.getElementById(
        "mainProductImage"
    ).src =
        currentProduct.front;


    if(currentProduct.description){

        document.getElementById(
            "productDescription"
        ).textContent =
            currentProduct.description;

    }


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "productLayout"
    ).style.display =
        "grid";


    updateCartCount();

}


/* ================= GALLERY ================= */

function showImage(type,button){

    const mainImage =
        document.getElementById(
            "mainProductImage"
        );


    mainImage.className =
        "main-photo " + type;


    currentView = type;


    document
        .querySelectorAll(".thumb")
        .forEach(function(item){

            item.classList.remove("active");

        });


    if(button){

        button.classList.add("active");

    }


    if(type === "front"){

        mainImage.src =
            currentProduct.front;

    }


    else if(type === "back"){

        mainImage.src =
            currentProduct.back;

    }


    else if(type === "sizechart"){

        mainImage.src =
            "size-chart.png";

    }

}


/* ================= SIZE ================= */

function selectSize(size,button){

    selectedSize = size;


    document
        .querySelectorAll(".size-option")
        .forEach(function(item){

            item.classList.remove("active");

        });


    button.classList.add("active");

}


/* ================= QUANTITY ================= */

function changeQuantity(amount){

    quantity += amount;


    if(quantity < 1){

        quantity = 1;

    }


    document.getElementById(
        "quantity"
    ).textContent =
        quantity;

}


/* ================= CART ================= */

function getCart(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "mainstreamCart"
            ) || "[]"
        );

    }

    catch(error){

        return [];

    }

}


function saveCart(cart){

    localStorage.setItem(
        "mainstreamCart",
        JSON.stringify(cart)
    );

}


function addToCart(){

    if(!currentProduct){

        return;

    }


    const cart =
        getCart();


    cart.push({

        id: currentProduct.id || productKey,
        slug: requestedProduct,

        name:
            currentProduct.name,

        price:
            Number(currentProduct.price || 999),

        image:
            currentProduct.front,

        size:
            selectedSize,

        quantity:
            quantity

    });


    saveCart(cart);

    updateCartCount();


    alert(
        currentProduct.name +
        " added to cart"
    );

}


/* ================= BUY NOW ================= */

function buyNow(){

    if(!currentProduct){

        return;

    }


    const buyNowProduct = {

        id: currentProduct.id || productKey,
        slug: requestedProduct,

        name:
            currentProduct.name,

        price:
            Number(currentProduct.price || 999),

        image:
            currentProduct.front,

        size:
            selectedSize,

        quantity:
            quantity

    };


    localStorage.setItem(
        "mainstreamBuyNow",
        JSON.stringify(
            buyNowProduct
        )
    );


    window.location.href =
        "shipping.html";

}


/* ================= CART COUNT ================= */

function updateCartCount(){

    const cart =
        getCart();


    let total = 0;


    cart.forEach(function(item){

        total +=
            Number(
                item.quantity || 1
            );

    });


    document.getElementById(
        "cartCount"
    ).textContent =
        total;

}


/* ================= MOBILE SWIPE ================= */

let startX = 0;


const imageBox =
    document.getElementById(
        "imageBox"
    );


imageBox.addEventListener(
    "touchstart",
    function(event){

        startX =
            event.touches[0].clientX;

    }
);


imageBox.addEventListener(
    "touchend",
    function(event){

        const endX =
            event.changedTouches[0].clientX;


        const difference =
            endX - startX;


        if(Math.abs(difference) < 50){

            return;

        }


        if(difference < 0){

            nextGallery();

        }

        else{

            previousGallery();

        }

    }
);


/* ================= GALLERY NAVIGATION ================= */

function nextGallery(){

    const views = [
        "front",
        "back",
        "sizechart"
    ];


    let index =
        views.indexOf(
            currentView
        );


    index++;


    if(index >= views.length){

        index = 0;

    }


    const buttons =
        document.querySelectorAll(
            ".thumb"
        );


    showImage(
        views[index],
        buttons[index]
    );

}


function previousGallery(){

    const views = [
        "front",
        "back",
        "sizechart"
    ];


    let index =
        views.indexOf(
            currentView
        );


    index--;


    if(index < 0){

        index =
            views.length - 1;

    }


    const buttons =
        document.querySelectorAll(
            ".thumb"
        );


    showImage(
        views[index],
        buttons[index]
    );

}


/* ================= START ================= */

loadProduct();

updateCartCount();

</script>

</body>
</html>
