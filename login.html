<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAINSTREAM™ | Admin Login</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b0b0d;
    font-family:Arial,sans-serif;
    color:#fff;
}

.login-box{
    width:90%;
    max-width:420px;
    padding:40px 30px;
    background:#151519;
    border:1px solid #29292f;
    border-radius:18px;
}

.logo{
    display:block;
    width:190px;
    max-width:80%;
    margin:0 auto 35px;
    filter:brightness(0) saturate(100%)
    invert(82%) sepia(99%)
    saturate(1000%)
    hue-rotate(5deg)
    brightness(105%)
    contrast(105%);
}

h1{
    margin:0 0 8px;
    font-size:28px;
}

.subtitle{
    color:#888;
    margin-bottom:30px;
}

label{
    display:block;
    margin:18px 0 8px;
    color:#aaa;
    font-size:13px;
    letter-spacing:1px;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #333;
    border-radius:8px;
    background:#0d0d0f;
    color:#fff;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#ffd900;
}

button{
    width:100%;
    margin-top:25px;
    padding:16px;
    border:0;
    border-radius:8px;
    background:#ffd900;
    color:#000;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

#error{
    display:none;
    margin-top:18px;
    padding:12px;
    border-radius:8px;
    background:#2a1717;
    color:#ff7777;
    font-size:14px;
}

</style>

</head>

<body>

<div class="login-box">

<img
    src="mainstream-logo.png"
    class="logo"
    alt="MAINSTREAM">

<h1>ADMIN LOGIN</h1>

<div class="subtitle">
    MAINSTREAM™ Admin Panel
</div>

<label>EMAIL</label>

<input
    type="email"
    id="email"
    placeholder="Admin email"
    autocomplete="email">

<label>PASSWORD</label>

<input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password">

<button id="loginBtn" onclick="login()">
    LOGIN →
</button>

<div id="error"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const mainstreamDB = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const button =
        document.getElementById("loginBtn");

    const errorBox =
        document.getElementById("error");

    errorBox.style.display = "none";

    if(!email || !password){

        errorBox.textContent =
            "Please enter your email and password.";

        errorBox.style.display = "block";

        return;
    }

    button.disabled = true;
    button.textContent = "LOGGING IN...";

    const { error } =
        await mainstreamDB.auth.signInWithPassword({
            email: email,
            password: password
        });

    if(error){

        errorBox.textContent =
            error.message;

        errorBox.style.display = "block";

        button.disabled = false;
        button.textContent = "LOGIN →";

        return;
    }

    window.location.href = "admin.html";
}

</script>

</body>
</html>
