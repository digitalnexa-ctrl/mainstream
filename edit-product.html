<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Edit Product | MAINSTREAM™</title>

<link
    rel="icon"
    type="image/png"
    href="mainstream-logo.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --yellow:#FFD400;
    --black:#080808;
    --card:#151515;
    --border:#292929;
    --muted:#777;
    --white:#fff;
    --red:#FF5C5C;
    --green:#39D98A;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--black);
    color:var(--white);
    min-height:100vh;
}


/* HEADER */

.header{
    height:76px;
    background:#090909;
    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    width:165px;

    filter:
        brightness(0)
        saturate(100%)
        invert(82%)
        sepia(99%)
        saturate(1700%)
        hue-rotate(4deg)
        brightness(105%)
        contrast(105%);
}

.back-link{
    color:var(--yellow);
    text-decoration:none;

    font-size:10px;
    font-weight:900;

    border:1px solid #333;
    border-radius:6px;

    padding:10px 13px;
}

.back-link:hover{
    background:var(--yellow);
    color:#000;
}


/* MAIN */

.main{
    max-width:900px;
    margin:0 auto;

    padding:35px 25px 80px;
}

.page-heading{
    margin-bottom:25px;
}

.page-heading h1{
    font-size:32px;
    font-weight:900;
    letter-spacing:-1px;
}

.page-heading p{
    color:var(--muted);
    font-size:12px;
    margin-top:8px;
}


/* FORM */

.form-card{
    background:var(--card);

    border:1px solid var(--border);
    border-radius:14px;

    overflow:hidden;
}


/* CURRENT PRODUCT */

.current-product{
    padding:25px;

    border-bottom:1px solid var(--border);
}

.section-title{
    font-size:13px;
    font-weight:900;

    margin-bottom:18px;
}

.product-preview{
    display:flex;
    align-items:center;

    gap:18px;

    background:#0c0c0c;

    border:1px solid #333;

    border-radius:10px;

    padding:15px;
}

.preview-image{
    width:95px;
    height:95px;

    background:#222;

    border-radius:8px;

    overflow:hidden;

    flex-shrink:0;
}

.preview-image img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.preview-name{
    font-size:18px;
    font-weight:900;
}

.preview-price{
    color:var(--yellow);

    font-size:13px;
    font-weight:bold;

    margin-top:8px;
}


/* FORM SECTION */

.form-section{
    padding:25px;

    border-bottom:1px solid var(--border);
}

.form-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1 / -1;
}

.field label{
    color:#888;

    font-size:9px;
    font-weight:900;

    letter-spacing:1.4px;

    margin-bottom:8px;
}

.field input,
.field select,
.field textarea{
    width:100%;

    background:#0c0c0c;
    color:#fff;

    border:1px solid #333;

    border-radius:8px;

    outline:none;

    padding:14px;

    font-family:inherit;

    font-size:12px;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:var(--yellow);
}

.field textarea{
    min-height:130px;
    resize:vertical;
}

.field input::placeholder,
.field textarea::placeholder{
    color:#555;
}


/* IMAGE */

.upload-area{
    border:1px dashed #444;

    border-radius:10px;

    background:#0c0c0c;

    min-height:170px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:20px;

    cursor:pointer;
}

.upload-area:hover{
    border-color:var(--yellow);
}

#productImage{
    display:none;
}

.image-preview{
    display:none;

    max-width:220px;
    max-height:220px;

    margin:0 auto 12px;

    border-radius:8px;

    border:1px solid #333;

    object-fit:contain;
}

.upload-title{
    color:#aaa;

    font-size:11px;
    font-weight:bold;
}

.upload-note{
    color:#555;

    font-size:9px;

    margin-top:6px;
}


/* ACTIONS */

.form-actions{
    padding:20px 25px;

    display:flex;

    justify-content:space-between;

    gap:10px;
}

.left-actions,
.right-actions{
    display:flex;
    gap:10px;
}

.cancel-btn,
.delete-btn,
.save-btn{
    min-width:125px;

    padding:13px 18px;

    border-radius:7px;

    font-size:10px;
    font-weight:900;

    cursor:pointer;
}

.cancel-btn{
    background:transparent;

    color:#999;

    border:1px solid #333;
}

.cancel-btn:hover{
    color:#fff;
    border-color:#555;
}

.delete-btn{
    background:transparent;

    color:var(--red);

    border:1px solid #422020;
}

.delete-btn:hover{
    background:var(--red);
    color:#000;
}

.save-btn{
    background:var(--yellow);

    color:#000;

    border:1px solid var(--yellow);
}

.save-btn:hover{
    background:#ffe34d;
}


/* MOBILE */

@media(max-width:650px){

    .header{
        height:64px;
        padding:0 15px;
    }

    .logo{
        width:125px;
    }

    .back-link{
        font-size:8px;
        padding:8px 9px;
    }

    .main{
        padding:25px 14px 50px;
    }

    .page-heading h1{
        font-size:27px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .current-product,
    .form-section{
        padding:20px;
    }

    .product-preview{
        gap:12px;
    }

    .preview-image{
        width:75px;
        height:75px;
    }

    .preview-name{
        font-size:14px;
    }

    .form-actions{
        flex-direction:column;

        padding:18px;
    }

    .left-actions,
    .right-actions{
        width:100%;
    }

    .left-actions > *,
    .right-actions > *{
        flex:1;
    }

    .cancel-btn,
    .delete-btn,
    .save-btn{
        width:100%;
        min-width:0;
    }

}


/* MESSAGE */

.message{
    display:none;

    position:fixed;

    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    background:var(--yellow);
    color:#000;

    padding:13px 18px;

    border-radius:7px;

    font-size:10px;
    font-weight:900;

    z-index:500;
}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <a href="admin.html">

        <img
            src="mainstream-logo.png"
            class="logo"
            alt="MAINSTREAM™">

    </a>


    <a
        href="inventory.html"
        class="back-link">

        ← INVENTORY

    </a>

</header>



<main class="main">


    <div class="page-heading">

        <h1>
            Edit Product
        </h1>

        <p>
            Update your MAINSTREAM™ product information.
        </p>

    </div>



    <form
        class="form-card"
        id="editForm"
        onsubmit="saveChanges(event)">


        <!-- CURRENT PRODUCT -->

        <section class="current-product">

            <div class="section-title">
                CURRENT PRODUCT
            </div>


            <div class="product-preview">


                <div class="preview-image">

                    <img
                        id="previewImage"
                        src="mainstream-logo.png"
                        alt="Product">

                </div>


                <div>

                    <div
                        class="preview-name"
                        id="previewName">

                        Product

                    </div>


                    <div
                        class="preview-price"
                        id="previewPrice">

                        ₹0

                    </div>

                </div>

            </div>

        </section>



        <!-- PRODUCT DETAILS -->

        <section class="form-section">


            <div class="section-title">
                PRODUCT DETAILS
            </div>


            <div class="form-grid">


                <div class="field full">

                    <label for="productName">
                        PRODUCT NAME
                    </label>

                    <input
                        id="productName"
                        type="text"
                        required>

                </div>


                <div class="field">

                    <label for="productPrice">
                        PRICE
                    </label>

                    <input
                        id="productPrice"
                        type="number"
                        min="0"
                        required>

                </div>


                <div class="field">

                    <label for="productCategory">
                        CATEGORY
                    </label>

                    <select
                        id="productCategory">

                        <option value="Racing Collection">
                            Racing Collection
                        </option>

                        <option value="Streetwear">
                            Streetwear
                        </option>

                        <option value="Premium Collection">
                            Premium Collection
                        </option>

                        <option value="New Drop">
                            New Drop
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="productStock">
                        STOCK QUANTITY
                    </label>

                    <input
                        id="productStock"
                        type="number"
                        min="0"
                        required>

                </div>


                <div class="field">

                    <label for="productSKU">
                        SKU
                    </label>

                    <input
                        id="productSKU"
                        type="text">

                </div>


                <div class="field full">

                    <label for="productDescription">
                        DESCRIPTION
                    </label>

                    <textarea
                        id="productDescription"
                        placeholder="Enter product description..."></textarea>

                </div>

            </div>

        </section>



        <!-- IMAGE -->

        <section class="form-section">


            <div class="section-title">
                PRODUCT IMAGE
            </div>


            <label
                class="upload-area"
                for="productImage">


                <div>

                    <img
                        id="imagePreview"
                        class="image-preview"
                        alt="New product image">


                    <div
                        id="uploadTitle"
                        class="upload-title">

                        Change product image

                    </div>


                    <div
                        id="uploadNote"
                        class="upload-note">

                        PNG, JPG or WEBP

                    </div>

                </div>


            </label>


            <input
                id="productImage"
                type="file"
                accept="image/png,image/jpeg,image/webp">

        </section>



        <!-- ACTIONS -->

        <div class="form-actions">


            <div class="left-actions">

                <button
                    type="button"
                    class="delete-btn"
                    onclick="deleteProduct()">

                    DELETE PRODUCT

                </button>

            </div>


            <div class="right-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="cancelEdit()">

                    CANCEL

                </button>


                <button
                    type="submit"
                    class="save-btn">

                    SAVE CHANGES

                </button>

            </div>

        </div>


    </form>


</main>


<div
    class="message"
    id="message">

    Saved

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const mainstreamDB = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   PRODUCT ID
========================================= */

const params =
    new URLSearchParams(window.location.search);

const productId =
    params.get("product");


let currentProduct = null;
let selectedImage = "";


/* =========================================
   GET PRODUCT
========================================= */

async function loadProduct(){

    if(!productId){

        alert("Product ID missing.");

        window.location.href =
            "inventory.html";

        return;
    }


    const {
        data,
        error
    } =
        await mainstreamDB
        .from("products")
        .select("*")
        .eq("slug", productId)
        .single();


    if(error || !data){

        console.error(
            "Product loading error:",
            error
        );

        alert(
            "Product not found."
        );

        window.location.href =
            "inventory.html";

        return;
    }


    currentProduct = data;


    /* PRODUCT NAME */

    document.getElementById(
        "productName"
    ).value =
        data.name || "";


    /* PRICE */

    document.getElementById(
        "productPrice"
    ).value =
        Number(data.price || 0);


    /* CATEGORY */

    document.getElementById(
        "productCategory"
    ).value =
        data.category ||
        "Racing Collection";


    /* STOCK */

    document.getElementById(
        "productStock"
    ).value =
        Number(data.stock || 0);


    /* SKU */

    document.getElementById(
        "productSKU"
    ).value =
        data.sku || "";


    /* DESCRIPTION */

    document.getElementById(
        "productDescription"
    ).value =
        data.description || "";


    /* IMAGE */

    const image =
        data.image_url ||
        data.front_image ||
        "mainstream-logo.png";


    document.getElementById(
        "previewImage"
    ).src =
        image;


    document.getElementById(
        "previewName"
    ).textContent =
        data.name || "Product";


    document.getElementById(
        "previewPrice"
    ).textContent =
        "₹" +
        Number(
            data.price || 0
        ).toLocaleString("en-IN");


    console.log(
        "MAINSTREAM product loaded:",
        data
    );
}


/* =========================================
   IMAGE UPLOAD
========================================= */

document
.getElementById("productImage")
.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                selectedImage =
                    e.target.result;


                document.getElementById(
                    "imagePreview"
                ).src =
                    selectedImage;


                document.getElementById(
                    "imagePreview"
                ).style.display =
                    "block";


                document.getElementById(
                    "uploadTitle"
                ).textContent =
                    "New image selected";


                document.getElementById(
                    "uploadNote"
                ).textContent =
                    file.name;

            };


        reader.readAsDataURL(file);

    }
);


/* =========================================
   SAVE CHANGES
========================================= */

async function saveChanges(event){

    event.preventDefault();


    if(!currentProduct){

        alert(
            "Product not loaded."
        );

        return;
    }


    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );


    const category =
        document.getElementById(
            "productCategory"
        ).value;


    const stock =
        Number(
            document.getElementById(
                "productStock"
            ).value
        );


    const sku =
        document.getElementById(
            "productSKU"
        ).value.trim();


    const description =
        document.getElementById(
            "productDescription"
        ).value.trim();


    if(!name){

        alert(
            "Please enter product name."
        );

        return;
    }


    if(price < 0){

        alert(
            "Price cannot be negative."
        );

        return;
    }


    if(stock < 0){

        alert(
            "Stock cannot be negative."
        );

        return;
    }


    /* -----------------------------------------
       CREATE NEW SLUG ONLY IF NAME CHANGED
    ----------------------------------------- */

    const newSlug =
        name
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            "");


    /* -----------------------------------------
       CHECK SLUG CONFLICT
    ----------------------------------------- */

    if(newSlug !== currentProduct.slug){

        const {
            data:existingProduct
        } =
            await mainstreamDB
            .from("products")
            .select("id,slug")
            .eq("slug", newSlug)
            .maybeSingle();


        if(existingProduct){

            alert(
                "Another product already uses this name."
            );

            return;
        }

    }


    /* -----------------------------------------
       UPDATE OBJECT
    ----------------------------------------- */

    const updateData = {

        name:name,

        slug:newSlug,

        price:price,

        category:category,

        stock:stock,

        sku:sku || null,

        description:
            description || null,

        updated_at:
            new Date().toISOString()

    };


    /* -----------------------------------------
       IMAGE
    ----------------------------------------- */

    if(selectedImage){

        updateData.image_url =
            selectedImage;

    }


    /* -----------------------------------------
       UPDATE SUPABASE
    ----------------------------------------- */

    const {
        data,
        error
    } =
        await mainstreamDB
        .from("products")
        .update(updateData)
        .eq("id", currentProduct.id)
        .select()
        .single();


    if(error){

        console.error(
            "Supabase update error:",
            error
        );


        alert(
            "Product could not be updated.\n\n" +
            error.message
        );


        return;
    }


    /* -----------------------------------------
       UPDATE LOCAL STORAGE TOO
    ----------------------------------------- */

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "mainstreamProducts"
                ) || "[]"
            );


        const updated =
            saved.map(
                function(product){

                    if(
                        String(product.slug)
                        ===
                        String(currentProduct.slug)
                    ){

                        return {

                            ...product,

                            name:name,

                            slug:newSlug,

                            price:price,

                            category:category,

                            stock:stock,

                            sku:sku,

                            description:description,

                            image:
                                selectedImage ||
                                product.image ||
                                ""

                        };

                    }


                    return product;

                }
            );


        localStorage.setItem(
            "mainstreamProducts",
            JSON.stringify(updated)
        );

    }catch(error){

        console.warn(
            "Local storage update skipped:",
            error
        );

    }


    alert(
        "Product updated successfully!"
    );


    /*
       If slug changed, go to the
       new edit URL.
    */

    window.location.href =
        "inventory.html";

}


/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(){

    if(!currentProduct){

        return;
    }


    const confirmed =
        confirm(
            "Delete " +
            currentProduct.name +
            " permanently?"
        );


    if(!confirmed){

        return;
    }


    const {
        error
    } =
        await mainstreamDB
        .from("products")
        .delete()
        .eq(
            "id",
            currentProduct.id
        );


    if(error){

        console.error(
            "Supabase delete error:",
            error
        );


        alert(
            "Product could not be deleted.\n\n" +
            error.message
        );


        return;
    }


    /* REMOVE FROM LOCAL STORAGE */

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "mainstreamProducts"
                ) || "[]"
            );


        const filtered =
            saved.filter(
                function(product){

                    return String(
                        product.slug
                    )
                    !==
                    String(
                        currentProduct.slug
                    );

                }
            );


        localStorage.setItem(
            "mainstreamProducts",
            JSON.stringify(filtered)
        );

    }catch(error){

        console.warn(
            "Local storage delete skipped:",
            error
        );

    }


    alert(
        "Product deleted successfully!"
    );


    window.location.href =
        "inventory.html";

}


/* =========================================
   CANCEL
========================================= */

function cancelEdit(){

    window.location.href =
        "inventory.html";

}


/* =========================================
   START
========================================= */

loadProduct();

                    </script>

                                            


<script>

async function checkEditProductLogin(){

    const {
        data: { session }
    } = await mainstreamDB.auth.getSession();

    if(!session){
        window.location.href = "login.html";
        return;
    }

    console.log("MAINSTREAM Edit Product authenticated");
}

checkEditProductLogin();

</script>

</body>

</html>
