<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist | MAINSTREAM</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}header{height:76px;background:#090909;border-bottom:1px solid #292929;display:flex;align-items:center;justify-content:space-between;padding:0 5%}header img{width:165px;filter:brightness(0) saturate(100%) invert(82%) sepia(99%) saturate(1700%) hue-rotate(4deg) brightness(105%) contrast(105%)}nav{display:flex;gap:22px}a{color:#ffd400;text-decoration:none;font-size:11px;font-weight:bold}main{max-width:1400px;margin:auto;padding:38px 5% 80px}.eyebrow{color:#ffd400;font-size:10px;letter-spacing:3px;font-weight:bold}h1{font-size:38px;margin:10px 0}.heading{margin-bottom:28px}.heading p:last-child,.muted{color:#888;font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.card,.panel{background:#151515;border:1px solid #292929;border-radius:12px;padding:20px}.label{color:#888;font-size:10px;letter-spacing:1.5px}.value{font-size:28px;font-weight:900;margin-top:12px}.table-wrap{overflow:auto;background:#151515;border:1px solid #292929;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:15px 18px;border-bottom:1px solid #292929;font-size:12px}th{color:#888;font-size:9px;letter-spacing:1.2px}td{color:#ddd}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select{background:#101010;color:#fff;border:1px solid #333;border-radius:7px;padding:12px;font:inherit}button{background:#ffd400;color:#111;border:0;border-radius:7px;padding:12px 18px;font-weight:800;cursor:pointer}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:8px}.field label{color:#aaa;font-size:11px}.field input{width:100%}.actions{margin-top:20px;display:flex;gap:12px;align-items:center}.status{color:#39d98a;font-size:12px}@media(max-width:700px){main{padding:25px 16px 60px}.cards{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}h1{font-size:30px}}</style></head><body><header><a href="admin.html"><img src="mainstream-logo.png" alt="MAINSTREAM"></a><nav><a href="admin.html">DASHBOARD</a><a href="orders.html">ORDERS</a></nav></header><main><div class="heading"><p class="eyebrow">MAINSTREAM ADMIN</p><h1>Wishlist</h1><p>Wishlist records synced from storefront browsers. Visitor IDs are anonymous.</p></div><div class="toolbar"><input id="q" placeholder="Search product or visitor ID"></div><div class="table-wrap"><table><thead><tr><th>PRODUCT</th><th>SLUG</th><th>VISITOR ID</th><th>ADDED</th></tr></thead><tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const money=v=>"₹"+Number(v||0).toLocaleString("en-IN");const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function guard(){const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html";return false;}return true;}let items=[];async function load(){if(!await guard())return;const {data,error}=await db.from("wishlist_items").select("*").order("created_at",{ascending:false}).limit(1500);if(error){document.getElementById("rows").innerHTML='<tr><td colspan="4">Wishlist table setup required: '+esc(error.message)+'</td></tr>';return}items=data||[];render()}function render(){const q=document.getElementById("q").value.toLowerCase(),a=items.filter(x=>[x.product_name,x.product_slug,x.visitor_id].join(" ").toLowerCase().includes(q));document.getElementById("rows").innerHTML=a.length?a.map(x=>'<tr><td>'+esc(x.product_name||"Product")+'</td><td>'+esc(x.product_slug)+'</td><td>'+esc(x.visitor_id)+'</td><td>'+esc(new Date(x.created_at).toLocaleString("en-IN"))+'</td></tr>').join(""):'<tr><td colspan="4">No wishlist records yet.</td></tr>'}document.getElementById("q").addEventListener("input",render);load();</script></body></html>
