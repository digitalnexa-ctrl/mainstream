<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orders | MAINSTREAM™</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0d0d0d;
    color:#fff;
}

.header{
    height:76px;
    background:#090909;
    border-bottom:1px solid #292929;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    width:165px;
    filter:
    brightness(0)
    saturate(100%)
    invert(82%)
    sepia(99%)
    saturate(1700%)
    hue-rotate(4deg)
    brightness(105%)
    contrast(105%);
}

.back{
    color:#FFD400;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
}

.main{
    padding:30px;
    max-width:1300px;
    margin:auto;
}

.title{
    font-size:30px;
    font-weight:900;
    margin-bottom:7px;
}

.subtitle{
    color:#777;
    font-size:13px;
    margin-bottom:28px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    padding:22px;
}

.label{
    color:#777;
    font-size:10px;
    letter-spacing:1.5px;
    font-weight:bold;
}

.value{
    font-size:27px;
    font-weight:900;
    margin-top:12px;
}

.panel{
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    overflow:hidden;
}

.panel-head{
    padding:20px;
    border-bottom:1px solid #292929;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.panel-title{
    font-size:16px;
    font-weight:900;
}

.filter{
    background:#222;
    border:1px solid #333;
    color:#FFD400;
    padding:9px 12px;
    border-radius:7px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
}

th{
    color:#666;
    font-size:9px;
    letter-spacing:1.5px;
    text-align:left;
    padding:16px 20px;
    border-bottom:1px solid #292929;
}

td{
    padding:18px 20px;
    border-bottom:1px solid #222;
    font-size:12px;
}

.empty{
    text-align:center;
    padding:60px 20px;
    color:#777;
}

.empty-icon{
    font-size:40px;
    margin-bottom:15px;
}

.status{
    color:#FFD400;
    font-size:9px;
    font-weight:bold;
}

@media(max-width:700px){

    .header{
        padding:0 16px;
    }

    .logo{
        width:125px;
    }

    .main{
        padding:20px 15px 40px;
    }

    .title{
        font-size:25px;
    }

    .stats{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<header class="header">

    <img
        src="mainstream-logo.png"
        class="logo"
        alt="MAINSTREAM™">

    <a href="admin.html" class="back">
        ← DASHBOARD
    </a>

</header>


<main class="main">

    <h1 class="title">
        Orders
    </h1>

    <p class="subtitle">
        Manage and track all customer orders.
    </p>


    <section class="stats">

        <div class="card">

            <div class="label">
                TOTAL ORDERS
            </div>

            <div class="value">
                0
            </div>

        </div>


        <div class="card">

            <div class="label">
                TOTAL REVENUE
            </div>

            <div class="value">
                ₹0
            </div>

        </div>


        <div class="card">

            <div class="label">
                PENDING
            </div>

            <div class="value">
                0
            </div>

        </div>

    </section>


    <section class="panel">

        <div class="panel-head">

            <div class="panel-title">
                All Orders
            </div>

            <select class="filter">
                <option>ALL ORDERS</option>
                <option>PENDING</option>
                <option>PROCESSING</option>
                <option>DELIVERED</option>
            </select>

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>ORDER ID</th>
                        <th>PRODUCT</th>
                        <th>CUSTOMER</th>
                        <th>SIZE</th>
                        <th>AMOUNT</th>
                        <th>STATUS</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td colspan="6">

                            <div class="empty">

                                <div class="empty-icon">
                                    📦
                                </div>

                                <strong>
                                    No orders yet
                                </strong>

                                <p style="margin-top:8px;">
                                    Customer orders will appear here.
                                </p>

                            </div>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

</body>
</html>
